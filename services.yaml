apiVersion: v1
kind: Service
metadata:
  name: liveness-demo
  namespace: probes
spec:
  type: NodePort
  selector:
    app: liveness-demo
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
  namespace: probes
spec:
  type: NodePort
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: startup-demo
  namespace: probes
spec:
  type: NodePort
  selector:
    app: startup-demo
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30082