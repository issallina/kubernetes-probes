apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource2
  namespace: probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liveness-demo
  template:
    metadata:
      labels:
        app: liveness-demo
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: app
        image: kaizenacademy/demo-app:1.0.0
        env:
        - name: STARTUP_SECONDS
          value: '0'
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 1m
            memory: 64Mi
          limits:
            cpu: 2m
            memory: 128Mi